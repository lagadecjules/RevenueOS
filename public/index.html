<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RevenueOS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--bg:#f5f7f8;--card:#fff;--ink:#12171d;--mut:#66727e;--line:#e1e6ea;--acc:#0f766e;--acc2:#e3f3f0;--onacc:#fff;--ok:#0f7a4d;--warn:#b45309;--err:#dc3c3c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1014;--card:#141a20;--ink:#eef2f5;--mut:#8b98a5;--line:#24303a;--acc:#2dd4bf;--acc2:#0f2a2a;--onacc:#04211f;--ok:#4ade80;--warn:#fbbf24;--err:#f87171}}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 "Inter Tight",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.w{max-width:820px;margin:0 auto;padding:16px 16px 60px}
header{display:flex;align-items:center;gap:10px;padding:10px 0 6px}
.logo{font-weight:600;font-size:17px;letter-spacing:-.02em;flex:1}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.tag.live{background:var(--ok);color:#fff}
#nav{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{background:none;border:0;border-bottom:2px solid transparent;font:inherit;color:var(--mut);padding:10px 12px;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--acc)}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
h1{font-size:26px;font-weight:600;letter-spacing:-.03em;margin:6px 0}
h2{font-size:18px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
h3{font-size:15px;font-weight:600;margin:2px 0}
.m{color:var(--mut);font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.b{font:inherit;font-size:14px;padding:8px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.bp{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:500}
.bp:disabled{opacity:.5;cursor:default}
.p{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--acc2);color:var(--acc);margin:2px 4px 2px 0}
.p.hi{background:rgba(220,60,60,.13);color:var(--err)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.dot.on{background:var(--ok)}.dot.off{background:var(--mut)}
.val{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
blockquote{border-left:2px solid var(--acc);padding-left:10px;margin:8px 0;color:var(--mut);font-style:italic;font-size:14px}
textarea,input[type=text]{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.seg{display:flex;gap:6px;margin:8px 0}.seg button{font:inherit;font-size:13px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.err{color:var(--err);font-size:13px;margin-top:6px}
.ok{color:var(--ok);font-size:13px;margin-top:6px;font-weight:500}
.why{background:var(--acc2);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13px}
.why ul{padding-left:18px;margin:6px 0}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
details{margin-top:8px}details summary{cursor:pointer;color:var(--mut);font-size:13px}
pre{white-space:pre-wrap;font-size:12px;background:var(--bg);padding:8px;border-radius:8px;max-height:200px;overflow:auto}
.orgbar{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.orgbar input{width:160px}
footer{margin-top:24px;font-size:12px;color:var(--mut);text-align:center}
</style></head><body><div class="w">
<header><span class="logo">RevenueOS</span><span class="tag live">EN LIGNE</span></header>
<div class="orgbar m">Organisation : <input type="text" id="orgInput" value="demo-org"><button class="b" data-a="setorg" style="padding:4px 10px">Changer</button></div>
<nav id="nav"></nav><main id="v"></main>
<footer>Serveur réel, données réelles. Rien n'est envoyé sans votre validation explicite.</footer></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const eur=n=>n==null?"non renseigné":Number(n).toLocaleString("fr-FR")+" €";
const PROVIDERS=[["google","Gmail"],["microsoft","Outlook"],["hubspot","HubSpot"],["salesforce","Salesforce"],["pipedrive","Pipedrive"]];
const S={tab:"connect",org:localStorage.getItem("revenueos_org")||"demo-org",integrations:[],opportunities:[],rejections:[],drafts:{},open:{},strat:{},busy:{}};
$("#orgInput").value=S.org;

async function api(path,opts){
  const res=await fetch(path,{headers:{"Content-Type":"application/json"},...opts});
  let data=null; try{data=await res.json()}catch{}
  if(!res.ok) throw new Error((data&&data.error)||("Erreur HTTP "+res.status));
  return data;
}

async function loadIntegrations(){
  try{ S.integrations=(await api(`/organizations/${S.org}/integrations`)).integrations; }
  catch{ S.integrations=[]; }
}
async function loadOpportunities(){
  try{ S.opportunities=(await api(`/organizations/${S.org}/opportunities`)).opportunities; }
  catch{ S.opportunities=[]; }
}
async function loadRejections(){
  try{ S.rejections=(await api(`/organizations/${S.org}/opportunities/rejections`)).rejections; }
  catch{ S.rejections=[]; }
}
async function loadDrafts(oppId){
  try{ S.drafts[oppId]=(await api(`/organizations/${S.org}/opportunities/${oppId}/drafts`)).drafts; }
  catch{ S.drafts[oppId]=[]; }
}

function vConnect(){
  const rows=PROVIDERS.map(([key,label])=>{
    const conn=S.integrations.find(i=>i.provider===key);
    return `<div class="c row">
      <div><span class="dot ${conn?"on":"off"}"></span><b>${label}</b>
      ${conn?`<div class="m">Connecté : ${esc(conn.accountLabel)}</div>`:`<div class="m">Non connecté</div>`}</div>
      ${conn?`<span class="p">actif</span>`:`<a class="b bp" href="/auth/${key}/start?organizationId=${encodeURIComponent(S.org)}">Connecter</a>`}
    </div>`;
  }).join("");
  return `<div class="c hero"><h1>Connexions</h1><p class="m">Connectez au moins une messagerie (Gmail ou Outlook) et un CRM pour que l'analyse ait de vraies données à examiner.</p></div>${rows}`;
}

function reasonList(r){ try{const a=JSON.parse(r); return a.map(x=>`<li>${esc(x)}</li>`).join("")}catch{return ""} }
function missingList(r){ try{const a=JSON.parse(r); return a.length?`<div class="m">Information manquante : ${a.map(esc).join(", ")}</div>`:""}catch{return ""} }

function oppCard(o){
  const hi=o.confidence>=80;
  const drafts=S.drafts[o.id]||[];
  const openDraft=drafts.find(d=>d.status==="draft");
  let h=`<div class="c" id="opp-${o.id}">
    <div class="row"><div><b>${esc(o.companyOrPerson)}</b><div class="m">${esc(o.type)} · source : ${esc(o.source)}</div></div><div class="val">${eur(o.estimatedValue)}</div></div>
    <div><span class="p ${hi?"hi":""}">confiance ${o.confidence}%</span><span class="p">statut : ${esc(o.status)}</span></div>
    <div class="why"><b>Pourquoi :</b><ul>${reasonList(o.reasons)}</ul>${missingList(o.missingInfo)}</div>
    <details><summary>Voir la preuve source</summary><pre>${esc(o.evidenceText)}</pre></details>
    <div style="margin-top:10px"><b>${esc(o.recommendedAction)}</b><div class="m">${esc(o.nextStep)}</div></div>`;

  if(!openDraft){
    const strat=S.strat[o.id]||"douce";
    h+=`<div class="seg">${[["douce","Douce"],["directe","Directe"],["valeur","Valeur"]].map(([k,l])=>`<button class="${strat===k?"on":""}" data-a="strat" data-i="${o.id}" data-x="${k}">${l}</button>`).join("")}</div>
    <button class="b bp" data-a="draft" data-i="${o.id}" ${S.busy[o.id]?"disabled":""}>${S.busy[o.id]==="draft"?'<span class="spin"></span> Génération…':"Préparer la relance"}</button>`;
  } else {
    h+=`<div style="margin-top:10px">
      <input type="text" data-field="subject" data-d="${openDraft.id}" value="${esc(openDraft.subject)}">
      <textarea data-field="body" data-d="${openDraft.id}" rows="8" style="margin-top:6px">${esc(openDraft.body)}</textarea>
      <div class="row" style="margin-top:8px">
        <button class="b" data-a="save" data-d="${openDraft.id}">Enregistrer les modifications</button>
        <button class="b bp" data-a="send" data-d="${openDraft.id}" data-o="${o.id}" ${S.busy[openDraft.id]?"disabled":""}>${S.busy[openDraft.id]==="send"?'<span class="spin"></span> Envoi…':"✓ Approuver et envoyer"}</button>
      </div>
      <div id="msg-${openDraft.id}"></div>
    </div>`;
  }
  const sentDrafts=drafts.filter(d=>d.status==="sent");
  if(sentDrafts.length) h+=`<div class="ok">✓ Relance envoyée (${new Date(sentDrafts[0].sent_at).toLocaleString("fr-FR")})</div>`;
  return h+"</div>";
}

function vOpportunities(){
  const hasEmail=S.integrations.some(i=>i.provider==="google"||i.provider==="microsoft");
  const hasCrm=S.integrations.some(i=>["hubspot","salesforce","pipedrive"].includes(i.provider));
  let top=`<div class="c hero"><h1>Opportunity Engine</h1><p class="m">Détecte les devis sans réponse et les prospects oubliés à partir de vos vraies données.</p>`;
  if(!hasEmail&&!hasCrm) top+=`<p class="err">Aucune connexion active. Allez d'abord dans l'onglet Connexions.</p>`;
  top+=`<button class="b bp" data-a="detect" ${S.busy.detect?"disabled":""}>${S.busy.detect?'<span class="spin"></span> Analyse en cours…':"Analyser mes données"}</button>
  <div id="detect-msg"></div></div>`;
  const list=S.opportunities.length
    ? S.opportunities.map(oppCard).join("")
    : `<div class="c m">Aucune opportunité détectée pour l'instant. Lancez une analyse ci-dessus.</div>`;
  const rej=`<div class="c"><details><summary>Voir les candidats rejetés par le garde-fou anti-hallucination (${S.rejections.length})</summary>
    ${S.rejections.map(r=>`<div style="margin-top:8px"><b>${esc(r.source)}/${esc(r.source_id)}</b><div class="m">${esc(r.reason)}</div></div>`).join("")||'<p class="m">Aucun rejet pour l\'instant.</p>'}
    </details></div>`;
  return top+list+rej;
}

function render(){
  $("#nav").innerHTML=[["connect","Connexions"],["opp","Opportunités"]].map(([k,l])=>
    `<button class="tab ${S.tab===k?"on":""}" data-a="tab" data-x="${k}">${l}</button>`).join("");
  $("#v").innerHTML = S.tab==="connect" ? vConnect() : vOpportunities();
}

async function refreshAll(){
  await loadIntegrations();
  if(S.tab==="opp"){ await loadOpportunities(); await loadRejections(); }
  render();
}

document.addEventListener("click", async (e)=>{
  const el=e.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a;
  if(a==="setorg"){
    S.org=$("#orgInput").value.trim()||"demo-org";
    localStorage.setItem("revenueos_org",S.org);
    await refreshAll(); return;
  }
  if(a==="tab"){ S.tab=el.dataset.x; await refreshAll(); return; }
  if(a==="strat"){ S.strat[el.dataset.i]=el.dataset.x; render(); return; }

  if(a==="detect"){
    S.busy.detect=true; render();
    try{
      const summary=await api(`/organizations/${S.org}/opportunities/detect`,{method:"POST",body:JSON.stringify({})});
      $("#detect-msg").innerHTML=`<p class="ok">${summary.candidatesFound} candidat(s) examiné(s), ${summary.opportunitiesSaved} opportunité(s) validée(s), ${summary.rejected} rejetée(s) par le garde-fou.</p>${summary.errors.length?`<p class="err">${summary.errors.map(esc).join("<br>")}</p>`:""}`;
      await loadOpportunities(); await loadRejections();
    }catch(err){ $("#detect-msg").innerHTML=`<p class="err">${esc(err.message)}</p>`; }
    S.busy.detect=false; render(); return;
  }

  if(a==="draft"){
    const oppId=el.dataset.i;
    S.busy[oppId]="draft"; render();
    try{
      await api(`/organizations/${S.org}/opportunities/${oppId}/draft`,{method:"POST",body:JSON.stringify({strategy:S.strat[oppId]||"douce"})});
      await loadDrafts(oppId);
    }catch(err){ alert("Génération refusée : "+err.message); }
    S.busy[oppId]=false; render(); return;
  }

  if(a==="save"){
    const d=el.dataset.d;
    const subject=document.querySelector(`[data-field=subject][data-d="${d}"]`).value;
    const body=document.querySelector(`[data-field=body][data-d="${d}"]`).value;
    try{ await api(`/organizations/${S.org}/drafts/${d}`,{method:"PATCH",body:JSON.stringify({subject,body})});
      document.getElementById(`msg-${d}`).innerHTML=`<p class="ok">Enregistré.</p>`;
    }catch(err){ document.getElementById(`msg-${d}`).innerHTML=`<p class="err">${esc(err.message)}</p>`; }
    return;
  }

  if(a==="send"){
    const d=el.dataset.d, oppId=el.dataset.o;
    S.busy[d]="send"; render();
    try{
      await api(`/organizations/${S.org}/drafts/${d}/send`,{method:"POST"});
      await loadDrafts(oppId); await loadOpportunities();
    }catch(err){
      document.getElementById(`msg-${d}`).innerHTML=`<p class="err">${esc(err.message)}</p>`;
    }
    S.busy[d]=false; render(); return;
  }
});

refreshAll();
</script></body></html>
